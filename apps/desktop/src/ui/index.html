<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' crx: data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Pixelbrowser</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="tabstrip">
    <div class="logo" title="Pixelbrowser">P</div>
    <div id="tabs"></div>
    <button id="newtab" class="pxbtn" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="toolbar">
    <button id="back" class="pxbtn" title="Back">&lt;</button>
    <button id="forward" class="pxbtn" title="Forward">&gt;</button>
    <button id="reload" class="pxbtn" title="Reload">R</button>
    <form id="addressform">
      <span id="agentbadge" hidden title="The AI agent is using this window">AGENT</span>
      <span id="shield" title="Ads &amp; trackers blocked in this window">0</span>
      <input id="address" spellcheck="false" autocomplete="off" placeholder="Search, type a URL, or ask AI a question">
    </form>
    <button id="ask" class="pxbtn" title="Ask Pixel AI (Shift+Enter in the address bar)">ASK</button>
    <browser-action-list id="actions" alignment="bottom right"></browser-action-list>
    <button id="ai" class="pxbtn ai" title="Pixel AI sidebar (Ctrl+J)">AI</button>
    <button id="aitoggle" class="pxswitch on" role="switch" aria-checked="true" title="AI on/off. Off = private: nothing is sent to any AI."><span class="knob"></span><span class="lbl">AI</span></button>
    <button id="store" class="pxbtn" title="Get extensions (Chrome Web Store)">EXT</button>
    <button id="private" class="pxbtn" title="New private window (Ctrl+Shift+N)">PVT</button>
  </div>
  <script src="ui.js"></script>
</body>
</html>
