plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bitshields'
version = '0.1.0'

android {
  namespace "expo.modules.bitshields"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.14.0"
}
